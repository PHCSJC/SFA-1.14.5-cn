name: Build SFA-1.14.5-cn

# Builds sing-box's libbox for Android from a pinned upstream tag, drops the
# resulting AARs into the SFA tree, then assembles a debug-signed APK.
#
# The two stages are deliberately separate: libbox is the slow part (gomobile
# cross-compiles the whole core twice, once for arm64 and once for the legacy
# 32-bit targets), while the Gradle stage is a few minutes. Splitting them
# keeps a Gradle failure from throwing away a finished libbox build.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      sing_box_ref:
        description: 'sing-box tag to build libbox from'
        required: false
        default: 'v1.14.5'
      sfa_ref:
        description: 'SFA tag/branch/commit to build the APK from'
        required: false
        default: 'ae93152'

env:
  SING_BOX_REF: ${{ github.event.inputs.sing_box_ref || 'v1.14.5' }}
  SFA_REF: ${{ github.event.inputs.sfa_ref || 'ae93152' }}
  GO_VERSION: '1.26.8'
  JAVA_VERSION: '17'
  # gomobile must be the sagernet fork; the stock one fails to link against
  # Go 1.26 with `invalid reference to os.checkPidfdOnce`.
  GOMOBILE_VERSION: 'v0.1.12'

jobs:
  libbox:
    name: Build libbox (${{ github.event.inputs.sing_box_ref || 'v1.14.5' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # This repo is only checked out for scripts/, hence the separate path.
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: build

      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runner image already ships an Android SDK at ANDROID_SDK_ROOT.
      # Do not use android-actions/setup-android here: it tries to install the
      # legacy "tools" package, which no longer exists, and fails the job.
      - name: Install NDK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init

      - name: Build libbox
        run: |
          # Not `go run ./cmd/internal/build_libbox`: that enables
          # with_naive_outbound, whose cronet static libs fail to link with
          # the runner's lld. See scripts/build-libbox.sh for the details.
          cd sing-box
          bash "$GITHUB_WORKSPACE/build/scripts/build-libbox.sh" "$SING_BOX_REF"

      - name: Show artefacts
        run: |
          ls -lh sing-box/libbox.aar sing-box/libbox-legacy.aar
          sha256sum sing-box/libbox.aar sing-box/libbox-legacy.aar

      - name: Upload libbox
        uses: actions/upload-artifact@v4
        with:
          name: libbox
          path: |
            sing-box/libbox.aar
            sing-box/libbox-legacy.aar
          retention-days: 7

  apk:
    name: Build APK (arm64-v8a)
    needs: libbox
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # This repo supplies scripts/ and overlay/; the SFA tree is separate.
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: build

      # checkout@v4 only resolves branches and tags, not bare commit SHAs, so
      # the branch is fetched and then reset to the pinned commit.
      - name: Checkout SFA
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box-for-android
          ref: main
          path: sfa
          fetch-depth: 0

      - name: Pin SFA to ${{ env.SFA_REF }}
        working-directory: sfa
        run: |
          git checkout --force $SFA_REF
          git log --oneline -1

      - name: Download libbox
        uses: actions/download-artifact@v4
        with:
          name: libbox
          path: sfa/app/libs

      - name: Verify libbox placement
        run: ls -lh sfa/app/libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install SDK packages
        run: |
          SDKM=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Apply China customisations
        run: bash "$GITHUB_WORKSPACE/build/scripts/apply-patches.sh" "$GITHUB_WORKSPACE/sfa"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('sfa/**/*.gradle*', 'sfa/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble APK
        working-directory: sfa
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOtherDebug --no-daemon -x lint

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find sfa/app/build/outputs/apk/other/debug -name '*arm64-v8a*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "no arm64 apk found; dumping tree"
            find sfa/app/build/outputs -name '*.apk' || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-apk
          path: ${{ steps.find_apk.outputs.apk }}
          retention-days: 30

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SFA 1.14.5-cn build ${{ github.run_number }}
          body: |
            sing-box `${{ env.SING_BOX_REF }}` + SFA `${{ env.SFA_REF }}`

            Built from commit ${{ github.sha }}.
          files: ${{ steps.find_apk.outputs.apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
